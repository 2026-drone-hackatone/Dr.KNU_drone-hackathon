# YOLO11n with an internal x2 bilinear upsample as layer 0.
# The network receives the untouched 1280x720 letterbox (imgsz 1280) and sees
# it at 2560x1440, so Detect strides in INPUT coordinates become [4, 8, 16].
# Every stock layer index is shifted by +1; pretrained yolo11 weights load with
# weights_layer_offset: 1 in the train config. Compute is ~4x the stock model.
nc: 3
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, nn.Upsample, [null, 2, bilinear]]   # 0  internal x2
  - [-1, 1, Conv, [64, 3, 2]]                   # 1  P1/2  (stock 0)
  - [-1, 1, Conv, [128, 3, 2]]                  # 2  P2/4  (stock 1)
  - [-1, 2, C3k2, [256, false, 0.25]]           # 3
  - [-1, 1, Conv, [256, 3, 2]]                  # 4  P3/8  (stock 3)
  - [-1, 2, C3k2, [512, false, 0.25]]           # 5
  - [-1, 1, Conv, [512, 3, 2]]                  # 6  P4/16 (stock 5)
  - [-1, 2, C3k2, [512, true]]                  # 7
  - [-1, 1, Conv, [1024, 3, 2]]                 # 8  P5/32 (stock 7)
  - [-1, 2, C3k2, [1024, true]]                 # 9
  - [-1, 1, SPPF, [1024, 5]]                    # 10
  - [-1, 2, C2PSA, [1024]]                      # 11

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]    # 12
  - [[-1, 7], 1, Concat, [1]]                   # 13 cat backbone P4
  - [-1, 2, C3k2, [512, false]]                 # 14
  - [-1, 1, nn.Upsample, [null, 2, nearest]]    # 15
  - [[-1, 5], 1, Concat, [1]]                   # 16 cat backbone P3
  - [-1, 2, C3k2, [256, false]]                 # 17 (P3)
  - [-1, 1, Conv, [256, 3, 2]]                  # 18
  - [[-1, 14], 1, Concat, [1]]                  # 19 cat head P4
  - [-1, 2, C3k2, [512, false]]                 # 20 (P4)
  - [-1, 1, Conv, [512, 3, 2]]                  # 21
  - [[-1, 11], 1, Concat, [1]]                  # 22 cat head P5
  - [-1, 2, C3k2, [1024, true]]                 # 23 (P5)
  - [[17, 20, 23], 1, Detect, [nc]]             # Detect(P3, P4, P5) -> strides 4, 8, 16 at input
