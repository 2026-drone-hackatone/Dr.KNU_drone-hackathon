# FINAL "train on everything" build for the competition submission models (Z runs).
# The competition scores a separate, unseen test split, so the provider's train
# AND val sequences are all used for training here. The val folder is kept as a
# copy of the provider val (14 sequences) only so Ultralytics can run its
# per-epoch validation: that metric is IN-SAMPLE and must not be used to pick
# checkpoints. Checkpoint choice for Z runs is fixed from the provider-split
# experiments (see docs/9).
name: airbility_uav_detection_trainval
source_root: data/airbility_uav_detection_dataset
output_root: data/processed/airbility_uav_detection_trainval_yolo
report: data/reports/airbility_uav_detection_trainval_preprocessing.json
link_mode: hardlink
seed: 42
source_frame_policy: available_images_only

names:
  0: quad_civil
  1: fixed_wing
  2: target_uav

# train = provider train (55 seq) + provider val (14 seq) = 69 sequences
# val   = provider val (14 seq), duplicated from train -> in-sample metric only
provider_val_destination: train_and_val
excluded_sequences: []
