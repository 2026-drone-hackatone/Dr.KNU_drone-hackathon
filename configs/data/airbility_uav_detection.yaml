name: airbility_uav_detection
source_root: data/airbility_uav_detection_dataset
output_root: data/processed/airbility_uav_detection_yolo
report: data/reports/airbility_uav_detection_preprocessing.json
link_mode: hardlink
seed: 42
source_frame_policy: available_images_only

